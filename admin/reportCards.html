<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../config.js"></script>
  <script src="../batch2.js"></script>
  <script src="rc/rc.js"></script>
  <title>KAUNA PRIVATE SCHOOL - TERMINAL REPORT CARDS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toolbar no-print">
    <h1>Report Cards</h1>
    <div class="select-container">
      <select id="sessionSelect">
        <option> -select session- </option>
      </select>
      <select id="classSelect">
        <option value=""> [select class] </option>
      </select>
      <button id="print" onclick="window.print()">Download / Print</button>
    </div>
  </div>
  <div id="container"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* ---------- Student passport ---------- */
  const PICS_DOMAIN = "https://pics.mainafly.com";
  const PLACEHOLDER = "../../std-pic.jpg";

  function studentKey(id) { return String(id).replaceAll("/", "_"); }
  function studentPicUrl(id) { return `${PICS_DOMAIN}/${schoolId}/${studentKey(id)}`; }
  window.picFallback = function (img) {
    const step = Number(img.dataset.step || 0);
    img.dataset.step = step + 1;
    if (step === 0) img.src = img.src.split("?")[0] + ".jpg";
    else if (step === 1) img.src = PLACEHOLDER;
    else { img.onerror = null; img.style.visibility = "hidden"; }
  };

  const terms = ["first term", "second term", "third term"];

  function key(token) {
    return token.replaceAll(" ", "").replaceAll("/", "").replaceAll(",", "");
  }
  function num(v) {
    return Number(String(v ?? "0").replace("-", "0")) || 0;
  }

  /* ---------- Sessions ---------- */
  let sessionsDoc = await getDoc(doc(db, schoolId, "sessions"));
  if (sessionsDoc.exists()) {
    let sessions = sessionsDoc.data().sessions;
    sessions = sessions.sort((a, b) => b.no - a.no);
    sessions.forEach((session, i) => {
      let year = session.year;
      let opt = document.createElement("option");
      opt.innerHTML = year + ", " + terms[session.term];
      sessionSelect.appendChild(opt);
      opt.setAttribute("data-year", year);
      opt.setAttribute("data-term", session.term);
      if (i == 0) opt.selected = true;
    });
  }

  /* ---------- Sections / classes ---------- */
  let sectionDoc = await getDoc(doc(db, schoolId, "section"));
  let teachersDoc = await getDoc(doc(db, schoolId, "teachers"));
  const sections = sectionDoc.data() ?? {};

  const user = await new Promise(resolve => {
    const unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); });
  });
  if (!user) {
    container.innerHTML = "<p>Please sign in first.</p>";
    throw new Error("Not signed in");
  }
  const id = user.email.replace(/@.*/, "");
  const hos = (teachersDoc.data() ?? {})[id] ?? {};

  if (id == schoolId) {
    Object.keys(sections).forEach(k => {
      let optG = document.createElement("optgroup");
      optG.label = k;
      (sections[k].classes ?? []).forEach(clas => optG.innerHTML += `<option>${clas}</option>`);
      classSelect.append(optG);
    });
  } else {
    (hos.adminFunctions?.rc?.resources ?? []).forEach(clas => classSelect.innerHTML += `<option>${clas}</option>`);
  }

  /* ---------- State ---------- */
  var students;
  var srp;
  var scoreInterpretations;
  var averageInterps;
  var scoreSheetConfig;
  var scoremeta;
  var predefinedAsms;
  var sectSubjs = [];
  var currentSect = "";

  async function loadStudents() {
    let clas = key(classSelect.value);
    let session = key(sessionSelect.value);
    students = null;
    if (!(clas && session)) return;

    let scoremetaDoc = await getDoc(doc(db, schoolId, session, clas, "scoremeta"));
    scoremeta = scoremetaDoc.exists() ? scoremetaDoc.data() : {};

    let sectK = "";
    for (const sect in sections) {
      sections[sect].classes = (sections[sect].classes ?? []).map(c => c.trim());
      if (sections[sect].classes.includes(classSelect.value)) {
        sectK = sect;
        break;
      }
    }
    if (!sectK) return;
    currentSect = sectK;

    srp = sections[sectK].srp || {};
    scoreInterpretations = sections[sectK].scoreInterpretations;
    scoreSheetConfig = sections[sectK].scoreSheetConfig;
    let assessments = scoreSheetConfig.assessments ?? [{ name: "CA", subtotal: 30 }];
    averageInterps = sections[sectK].averageInterpretations ?? [];
    sectSubjs = sections[sectK].subjects;
    predefinedAsms = [];
    scoreSheetConfig.derivedAsms ??= [];
    if (sections[sectK].useDerivedAsm && scoreSheetConfig.derivedAsms.length) {
      scoreSheetConfig.derivedAsms.forEach(dasm => {
        dasm.subtotal = 0;
        dasm.derivatives.forEach(d => {
          dasm.subtotal += Number(assessments.find(a => a.name == d).subtotal);
        });
        predefinedAsms.push(dasm);
      });
      const uses = {};
      predefinedAsms.forEach(d => d.derivatives.forEach(n => { uses[n] = (uses[n] || 0) + 1; }));
      assessments.forEach(a => {
        if (uses[a.name] !== 1) console.warn(`Assessment "${a.name}" is in ${uses[a.name] || 0} derived columns (should be 1) - heading Total will not match row totals`);
      });
    } else {
      predefinedAsms = assessments;
    }

    let stdsDoc = await getDoc(doc(db, schoolId, session, clas, "students"));
    students = stdsDoc.exists() ? Object.values(stdsDoc.data()) : null;
  }

  classSelect.onchange = async () => { await loadPositions(); };
  sessionSelect.onchange = async () => { await loadPositions(); };

  /* ---------- Ranking helpers ---------- */
  function cumTotals(s) {
    let total = 0, count = 0;
    (s.termAverages ?? []).forEach(t => { total += t.totalScore; count += t.subjectCount; });
    return { total, count };
  }
  const termAvg = s => s.sc ? s.score / s.sc : 0;
  const cumAvg = s => { const c = cumTotals(s); return c.count ? c.total / c.count : 0; };

  function rankBy(list, avgOf, field) {
    const sorted = [...list].sort((a, b) => avgOf(b) - avgOf(a));
    let last = null, lastPos = 0;
    sorted.forEach((s, i) => {
      const a = avgOf(s);
      if (last !== null && Math.abs(a - last) <= 1e-9) {
        s[field] = lastPos;
      } else {
        s[field] = i + 1;
        lastPos = i + 1;
        last = a;
      }
    });
  }

  /* ---------- Fit every card on exactly one A4 page ---------- */
  function fitSheet(sheet) {
    let fs = 13;
    const MIN = 6.5;
    sheet.style.setProperty("--fs", fs + "px");
    while (sheet.scrollHeight > sheet.clientHeight + 1 && fs > MIN) {
      fs -= 0.25;
      sheet.style.setProperty("--fs", fs + "px");
    }
  }
  function fitAll() {
    document.querySelectorAll(".sheet").forEach(fitSheet);
  }
  window.addEventListener("beforeprint", fitAll);

  async function loadPositions() {
    container.innerHTML = "";
    await loadStudents();
    if (!students) return;

    const termIndex = Number(sessionSelect.selectedOptions[0]?.getAttribute("data-term") ?? 0);
    const isThird = termIndex == 2;
    const asms = scoreSheetConfig.assessments ?? [{ name: "CA", subtotal: 30 }];

    /* ---- prepare each student ---- */
    students.forEach(student => {
      student.score = 0;
      student.sc = 0;
      const subjects = (student.subjects ??= {});
      const faith = student.religion == "Islam" ? "Muslim" : "Christian";

      for (const subj of Object.keys(subjects)) {
        const rec = subjects[subj][termIndex];
        if (!rec || rec.inactive) { delete subjects[subj]; continue; }
        if (!sectSubjs.includes(rec.subject)) { delete subjects[subj]; continue; }
        if (srp[rec.subject] && srp[rec.subject] != faith) { delete subjects[subj]; continue; }

        let total = 0;
        asms.forEach(a => { total += num(rec[a.name.toLowerCase()]); });
        total += num(rec.exam);
        student.score += total;
        student.sc++;
      }

      if (isThird) {
        student.termAverages = (student.termAverages ?? []).filter(t => t.termIndex != termIndex);
        student.termAverages.push({ termIndex, totalScore: student.score, subjectCount: student.sc });
      }
    });

    /* ---- positions ---- */
    rankBy(students, termAvg, "termPosition");
    if (isThird) rankBy(students, cumAvg, "cumPosition");
    students.sort((a, b) =>
      (isThird ? a.cumPosition - b.cumPosition : a.termPosition - b.termPosition)
      || (a.name || "").localeCompare(b.name || ""));

    const termName = sessionSelect.value.split(",")[1].trim().toUpperCase();
    const sessionName = sessionSelect.value.split(",")[0];

    /* ---- one report card per student ---- */
    students.forEach(std => {
      const avg = termAvg(std);
      const interp = interpret(avg, scoreInterpretations);
      const g = interp.grade ? interp.grade : grade(0, avg);

      let cumGrade = "", cumAvgVal = 0;
      if (isThird) {
        const c = cumTotals(std);
        cumAvgVal = c.count ? c.total / c.count : 0;
        const cInterp = interpret(cumAvgVal, scoreInterpretations);
        cumGrade = cInterp.grade ? cInterp.grade : grade(0, cumAvgVal);
      }

      const photo = std.id
        ? `<img class="std-photo" alt="" src="${studentPicUrl(std.id)}" onerror="picFallback(this)">`
        : `<img class="std-photo" alt="" src="${PLACEHOLDER}">`;

      /* info chips */
      const chips = [
        ["Class", classSelect.value],
        ["Term", termName],
        ["Session", sessionName],
        ["No. in class", students.length],
        [isThird ? "Term position" : "Position", toSuperscriptOrdinal(std.termPosition)]
      ];
      if (isThird) {
        chips.push(["Cumm. position", toSuperscriptOrdinal(std.cumPosition)]);
        chips.push(["Cumm. grade", cumGrade]);
      }
      chips.push(["Resumption", resumptionDate || "______________"]);
      const chipsHTML = chips.map(([l, v]) =>
        `<div class="chip"><span>${l}</span><b>${v}</b></div>`).join("");

      /* subjects table */
      let rowsHTML = "";
      const subjects = std.subjects ?? {};
      Object.keys(subjects).sort().forEach(subj => {
        const termScores = subjects[subj][termIndex];

        const scores = predefinedAsms.map(a => {
          if (a.derivatives) {
            let s = 0;
            a.derivatives.forEach(d => { s += num(termScores[d.toLowerCase()]); });
            return s;
          }
          return termScores[a.name.toLowerCase()];
        });

        let total = 0;
        asms.forEach(a => { total += num(termScores[a.name.toLowerCase()]); });
        const exam = num(termScores.exam);
        total += exam;

        const sInterp = interpret(total, scoreInterpretations);
        const sg = sInterp.grade ? sInterp.grade : grade(0, total);
        rowsHTML += `
          <tr>
            <td class="subj">${termScores.subject.toUpperCase()}</td>
            ${getScores(scores)}
            <td>${exam}</td>
            <td class="tot">${total}</td>
            <td><span class="gr ${gradeClass(sg)}">${sg}</span></td>
            <td class="rem">${sInterp.remark ? sInterp.remark : remark(0, total)}</td>
          </tr>`;
      });

      const comnt = comment(avg, averageInterps);

      /* behaviour and activities */
      let psychoHTML = "";
      const domains = sections[std.section]?.psychometrics ?? sections[currentSect]?.psychometrics ?? [];
      if (domains.length) {
        const ps = std.psychometrics ?? {};
        psychoHTML = `
          <section class="block psycho">
            <h4><i></i>Behaviour &amp; Activities</h4>
            <table>
              <tr>${domains.map(d => `<th>${d}</th>`).join("")}</tr>
              <tr>${domains.map(d => `<td>${ps[d] ?? 0}<small>/5</small></td>`).join("")}</tr>
            </table>
          </section>`;
      }

      const sheet = document.createElement("section");
      sheet.className = "sheet";
      sheet.innerHTML = `
        <header class="head">
          <div class="crest"><img class="logo" alt="" src="../logo.jpg"></div>
          <div class="school">
            <h2>${schoolName.toUpperCase()}</h2>
            <address>${schoolAddress}<br><i>${schoolEmail}</i></address>
          </div>
          <div class="passport">${photo}</div>
        </header>

        <div class="banner"><span>Terminal Report Card</span></div>

        <section class="student">
          <div class="sname">
            <span>Student</span>
            <b>${(std.name || "").toUpperCase()}</b>
            <em>${(std.gender || "").toUpperCase()}</em>
          </div>
          <div class="chips">${chipsHTML}</div>
        </section>

        <section class="results">
          <table class="rtable">
            <thead>
              <tr>
                <th class="subj">Subject</th>${getAsmHeads(predefinedAsms, scoreSheetConfig.exam)}
                <th>Grade</th>
                <th>Remark</th>
              </tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
          </table>
        </section>

        ${psychoHTML}

        <section class="summary">
          <div class="stat"><span>Total score</span><b>${std.score}</b></div>
          <div class="stat"><span>Term average</span><b>${tosf(avg, 4)}</b></div>
          ${isThird ? `<div class="stat gold"><span>Cumulative average</span><b>${tosf(cumAvgVal, 4)}</b></div>` : ""}
        </section>

        <section class="remarks">
          <div class="comment-box">
            <span>Comment</span>
            <p class="comment">${comnt}</p>
          </div>
          <div class="sign">
            <img id="stamp" alt="" src="stamp.png">
            <div class="line"><span>Authorized Signature</span></div>
          </div>
        </section>

        <footer class="powered">Powered by <strong>mainafly.com</strong></footer>
      `;
      container.append(sheet);
    });

    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    fitAll();
    // images can change nothing in height (fixed sizes) but refit once more to be safe
    requestAnimationFrame(fitAll);
  }

  function gradeClass(g) {
    const c = String(g || "").trim().charAt(0).toUpperCase();
    return "ABCDEF".includes(c) && c ? "g" + c : "";
  }

  function remark(test, exam) {
    const dict = {
      "F": "Fail", "E": "Poor", "D": "Fair",
      "C": "Good", "B": "Very Good", "A": "Excellent"
    };
    return dict[grade(test, exam)];
  }

  function grade(test, exam) {
    const total = test + exam;
    if (total < 40) return "F";
    if (total <= 45) return "E";
    if (total <= 49) return "D";
    if (total <= 59) return "C";
    if (total <= 69) return "B";
    return "A";
  }

  function getAsmHeads(asms, examTotal) {
    const hasExam = examTotal !== undefined && examTotal !== null && examTotal !== "" && !isNaN(Number(examTotal));
    let total = hasExam ? Number(examTotal) : 0;
    let txt = "";
    asms.forEach(a => {
      txt += `<th>${a.name} <small>(${a.subtotal})</small></th>`;
      total += Number(a.subtotal);
    });
    txt += `<th>Exam${hasExam ? ` <small>(${examTotal})</small>` : ""}</th><th>Total${hasExam ? ` <small>(${total})</small>` : ""}</th>`;
    return txt;
  }

  function getScores(scores) {
    let txt = "";
    scores.forEach(score => { txt += `<td>${score ?? "-"}</td>`; });
    return txt;
  }

  function tosf(n, sf) {
    if (n === 0) return 0;
    return Number(n.toPrecision(sf));
  }

  function comment(average, interpsModel) {
    for (const interp of interpsModel) {
      if (Number(average) < Number(interp.range)) return interp.comment;
    }
    const lastInterp = interpsModel[interpsModel.length - 1];
    return lastInterp?.comment || "";
  }

  function toSuperscriptOrdinal(n) {
    const suffixes = { '1': 'ˢᵗ', '2': 'ⁿᵈ', '3': 'ʳᵈ' };
    const lastTwo = n % 100;
    let suffix = 'ᵗʰ';
    if (lastTwo < 11 || lastTwo > 13) {
      suffix = suffixes[n % 10] || 'ᵗʰ';
    }
    return n + suffix;
  }
</script>

<style>
  :root {
    --maroon: #6a0822;
    --maroon-2: #870b2d;
    --maroon-deep: #3d0513;
    --gold: #b8903a;
    --gold-soft: #e9d8a8;
    --ink: #24202a;
    --muted: #6d6672;
    --paper: #fffdf9;
    --tint: #faf3f4;
    --line: #e6d9dc;
  }

  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    background: #e9e5e6;
    padding: 12px;
  }

  /* ---------- screen toolbar ---------- */
  .toolbar { max-width: 210mm; margin: 0 auto 14px; text-align: center; }
  .toolbar h1 {
    font-family: 'Playfair Display', serif;
    color: var(--maroon);
    margin: 4px 0 10px;
    font-size: 1.6rem;
    letter-spacing: .04em;
  }
  .select-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  select {
    flex: 1 1 200px;
    font: 500 15px 'Inter', sans-serif;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  button {
    font: 600 14px 'Inter', sans-serif;
    padding: 10px 18px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--maroon-2), var(--maroon-deep));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(106, 8, 34, .3);
  }
  button:hover { filter: brightness(1.12); }

  /* ---------- the A4 sheet ---------- */
  /* flex-start + auto side margins: centred when there is room, and the left edge
     stays reachable by scrolling when the screen is narrower than the sheet */
  #container { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #container > .sheet { margin-left: auto; margin-right: auto; }

  .sheet {
    --fs: 13px;
    font-size: var(--fs);
    width: 210mm;
    height: 297mm;
    padding: 9mm 10mm 7mm;
    background: var(--paper);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .55em;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
    /* double frame: maroon outer, gold inner */
    outline: 0;
  }
  .sheet::before {                       /* border frame */
    content: "";
    position: absolute;
    inset: 4mm;
    border: .35mm solid var(--maroon);
    box-shadow: inset 0 0 0 1mm var(--paper), inset 0 0 0 1.35mm var(--gold);
    pointer-events: none;
  }
  .sheet::after {                        /* faint watermark crest */
    content: "";
    position: absolute;
    left: 50%; top: 55%;
    width: 120mm; height: 120mm;
    transform: translate(-50%, -50%);
    background: url("../logo.jpg") center / contain no-repeat;
    opacity: .045;
    pointer-events: none;
  }
  .sheet > * { position: relative; z-index: 1; flex-shrink: 0; }

  /* header */
  .head {
    display: grid;
    grid-template-columns: 7em 1fr 7em;
    align-items: center;
    gap: .8em;
    padding: .2em .6em 0;
  }
  .crest, .passport { display: flex; }
  .crest { justify-content: flex-start; }
  .passport { justify-content: flex-end; }
  .logo {
    width: 6.4em; height: 6.4em;
    object-fit: contain;
    border-radius: 50%;
    border: .15em solid var(--gold);
    padding: .15em;
    background: #fff;
  }
  .std-photo {
    width: 5.6em; height: 6.6em;
    object-fit: cover;
    background: #fff;
    border: .16em solid var(--maroon);
    border-radius: .5em;
    box-shadow: 0 0 0 .14em var(--gold-soft), 0 .3em .8em rgba(0, 0, 0, .15);
  }
  .school { text-align: center; }
  .school h2 {
    margin: 0;
    font: 800 1.85em/1.1 'Playfair Display', serif;
    color: var(--maroon);
    letter-spacing: .05em;
  }
  .school address {
    margin-top: .35em;
    font-style: normal;
    font-size: .78em;
    line-height: 1.5;
    color: var(--muted);
  }
  .school address i { color: var(--maroon-2); font-style: normal; font-weight: 500; }

  /* banner */
  .banner {
    margin: .1em 0;
    padding: .5em 1em;
    text-align: center;
    background: linear-gradient(100deg, var(--maroon-deep), var(--maroon-2) 50%, var(--maroon-deep));
    border-top: .18em solid var(--gold);
    border-bottom: .18em solid var(--gold);
    border-radius: .15em;
  }
  .banner span {
    font: 700 1em 'Cormorant Garamond', serif;
    font-size: 1.25em;
    letter-spacing: .5em;
    text-transform: uppercase;
    color: #fff;
    padding-left: .5em;
  }

  /* student block */
  .student { display: flex; flex-direction: column; gap: .5em; padding: 0 .3em; }
  .sname {
    display: flex; align-items: baseline; gap: .8em;
    padding: .45em .8em;
    background: var(--tint);
    border-left: .3em solid var(--maroon);
    border-radius: .25em;
  }
  .sname span {
    font-size: .68em; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .sname b {
    flex: 1;
    font: 700 1.35em 'Playfair Display', serif;
    color: var(--maroon);
    letter-spacing: .02em;
  }
  .sname em {
    font-style: normal; font-size: .72em; font-weight: 700; letter-spacing: .12em;
    padding: .25em .8em; border-radius: 2em;
    border: .1em solid var(--gold); color: var(--maroon);
    background: #fff;
  }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5em, 1fr)); gap: .4em; }
  .chip {
    display: flex; flex-direction: column; gap: .1em;
    padding: .35em .7em;
    border: .08em solid var(--line);
    border-bottom: .17em solid var(--gold);
    border-radius: .35em;
    background: #fff;
  }
  .chip span { font-size: .62em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .chip b { font-size: .92em; font-weight: 700; color: var(--ink); }

  /* results table */
  .results { flex: 1 0 auto !important; padding: 0 .3em; }
  .rtable {

    letter-spacing: .06em;
    text-transform: uppercase;
    padding: .55em .4em;
    text-align: center;
    border-right: .06em solid rgba(255, 255, 255, .18);

  }
  .rtable thead th small { font-weight: 400; opacity: .8; letter-spacing: 0; }

  .rtable td {
    padding: .38em .4em;

  .rtable td:last-child { border-right: 0; }

  .rtable td.tot { font-weight: 700; color: var(--maroon); }

  .gr {
    display: inline-block; min-width: 1.9em; padding: .1em .4em;
    border-radius: .35em; font-weight: 700; font-size: .95em;
    background: #eee; color: var(--ink);
  }
  .gr.gA { background: #dff1e4; color: #14602e; }
  .gr.gB { background: #e3eefb; color: #1a4a86; }
  .gr.gC { background: #fbf2d4; color: #7a5a0c; }
  .gr.gD { background: #fde9d6; color: #92480f; }
  .gr.gE { background: #fbdede; color: #9d2222; }
  .gr.gF { background: #f4c7c7; color: #7a0f0f; }

  /* behaviour & activities */
  .block { padding: 0 .3em; }
  .psycho h4 {
    margin: 0 0 .3em;
    font: 700 .78em 'Inter', sans-serif;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--maroon);
    display: flex; align-items: center; gap: .6em;
  }
  .psycho h4 i { flex: 0 0 .6em; height: .6em; background: var(--gold); transform: rotate(45deg); }
  .psycho h4::after { content: ""; flex: 1; height: .08em; background: linear-gradient(90deg, var(--gold), transparent); }
  .psycho table {
    width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0;
    border: .08em solid var(--line); border-radius: .35em; overflow: hidden; background: #fff;
  }
  .psycho th, .psycho td { text-align: center; padding: .3em .2em; font-size: .72em; white-space: normal; }
  .psycho th {
    background: var(--tint); color: var(--maroon); font-weight: 600;
    border-right: .06em solid var(--line); border-bottom: .06em solid var(--line);
  }
  .psycho td { font-weight: 700; font-size: .85em; border-right: .06em solid var(--line); }
  .psycho th:last-child, .psycho td:last-child { border-right: 0; }
  .psycho small { font-weight: 400; color: var(--muted); }

  /* summary */
  .summary { display: flex; gap: .5em; padding: 0 .3em; }
  .stat {
    flex: 1;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: .5em .9em;
    background: linear-gradient(135deg, var(--maroon-2), var(--maroon-deep));
    color: #fff;
    border-radius: .4em;
    border-bottom: .18em solid var(--gold);
  }
  .stat span { font-size: .66em; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .stat b { font: 700 1.25em 'Playfair Display', serif; }
  .stat.gold { background: linear-gradient(135deg, #c9a14a, #94702a); }

  /* comment + signature */
  .remarks { display: grid; grid-template-columns: 1fr 15em; gap: .8em; padding: 0 .3em; align-items: stretch; }
  .comment-box {
    border: .08em solid var(--line);
    border-left: .3em solid var(--gold);
    border-radius: .35em;
    background: #fff;
    padding: .4em .9em .5em;
  }
  .comment-box span { font-size: .62em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .comment {

    font-family: 'Patrick Hand', cursive;
    font-size: 1.35em;
    line-height: 1.35;
    color: var(--maroon);
  }
  .sign { position: relative; display: flex; align-items: flex-end; justify-content: center; min-height: 5.2em; }
  #stamp {
    position: absolute; right: .3em; top: -.2em;
    width: 5.4em; height: 5.4em; border-radius: 50%;
    object-fit: cover; opacity: .92;
  }
  .sign .line {
    width: 100%; border-top: .08em solid var(--ink);
    text-align: center; padding-top: .25em; position: relative; z-index: 2;
  }
  .sign .line span { font-size: .64em; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .powered {
    text-align: center;
    font-size: .62em;
    color: var(--muted);
    letter-spacing: .06em;
    padding-top: .2em;
  }
  .powered strong { color: var(--maroon-2); }

  /* ---------- print: exactly one A4 page per student ---------- */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { margin: 0; padding: 0; background: #fff; width: 210mm; }
    .no-print { display: none !important; }
    #container { display: block; gap: 0; overflow: visible; }
    .sheet {
      box-shadow: none;
      margin: 0;
      width: 210mm;
      height: 296.5mm;               /* a hair under 297 so no blank page is ever inserted */
      break-after: page;
      page-break-after: always;
      break-inside: avoid;
    }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
