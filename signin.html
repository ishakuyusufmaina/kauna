<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
  <script src="batch2.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="asset/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="asset/favicon-16x16.png">
  <link rel="manifest" href="asset/site.webmanifest">
  <link rel="mask-icon" href="asset/favicon-512x512.png" color="#870b2d">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="asset/mstile-150x150.png">
  <meta name="theme-color" content="#2a0410">
  <title>Kauna - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">

  <style>
    :root {
      --wine: #870b2d;
      --wine-deep: #2a0410;
      --wine-glow: #c4264f;
      --gold: #e6c27a;
      --ink: #2f2d33;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--wine-deep);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---------- Animated logo background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, #5a0a22 0%, var(--wine-deep) 60%, #12020a 100%);
    }
    .bg-logo {
      position: absolute;
      top: 50%; left: 50%;
      width: 130vmax; height: 130vmax;
      transform: translate(-50%, -50%);
      background: url("logo.jpg") center / contain no-repeat;
      opacity: .16;
      filter: blur(6px) saturate(1.3);
      mix-blend-mode: screen;
      animation: bgDrift 40s ease-in-out infinite alternate;
    }
    .bg-logo.two {
      width: 55vmax; height: 55vmax;
      top: 20%; left: 82%;
      opacity: .10;
      filter: blur(2px);
      animation: bgDrift2 32s ease-in-out infinite alternate;
    }
    @keyframes bgDrift {
      from { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
      to   { transform: translate(-48%, -52%) rotate(6deg) scale(1.12); }
    }
    @keyframes bgDrift2 {
      from { transform: translate(-50%, -50%) rotate(10deg) scale(1); }
      to   { transform: translate(-60%, -40%) rotate(-12deg) scale(1.2); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .45;
      animation: float 14s ease-in-out infinite alternate;
    }
    .orb.a { width: 420px; height: 420px; background: var(--wine-glow); top: -120px; left: -100px; }
    .orb.b { width: 360px; height: 360px; background: #7b1fa2; bottom: -120px; right: -80px; opacity: .28; animation-duration: 18s; }
    .orb.c { width: 240px; height: 240px; background: var(--gold); bottom: 20%; left: 10%; opacity: .12; animation-duration: 22s; }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(60px, 40px) scale(1.15); }
    }

    .grain {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 4px 4px;
      opacity: .35;
      mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
    }

    /* ---------- Header ---------- */
    header {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.12);
      animation: dropIn .9s cubic-bezier(.2,.8,.2,1) both;
    }
    header::after {
      content: "";
      position: absolute; left: 0; bottom: -1px;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      background-size: 200% 100%;
      animation: sheen 5s linear infinite;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 18px rgba(196,38,79,.6);
      padding: 0 16px;
      text-align: center;
    }
    @keyframes sheen { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }

    /* ---------- Main + card ---------- */
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 18px 50px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 78px 34px 38px;
      border-radius: 26px;
      text-align: center;
      background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        0 30px 70px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 1px 0 rgba(255,255,255,.35) inset;
      animation: cardIn 1s .15s cubic-bezier(.2,.9,.25,1) both;
    }
    /* animated glowing border */
    .card::before {
      content: "";
      position: absolute; inset: -1px;
      border-radius: 27px;
      padding: 1px;
      background: conic-gradient(from var(--ang, 0deg), transparent 0 60%, var(--gold) 80%, var(--wine-glow) 90%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      animation: spin 6s linear infinite;
      pointer-events: none;
    }
    @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    @keyframes spin { to { --ang: 360deg; } }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(.94); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    /* Logo medallion */
    .logo-wrap {
      position: absolute;
      top: -56px; left: 50%;
      width: 112px; height: 112px;
      transform: translateX(-50%);
      border-radius: 20%;
      border-bottom-left-radius: 50%;
      border-bottom-right-radius: 50%;
      padding: 2px;
      background: conic-gradient(from 0deg, var(--gold), var(--wine-glow), #fff, var(--gold));
      animation: ring 8s linear infinite, pop 1s .5s cubic-bezier(.3,1.6,.4,1) both;
      box-shadow: 0 12px 34px rgba(0,0,0,.5), 0 0 40px rgba(230,194,122,.35);
    }
    .logo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 20%;
      border-bottom-left-radius: 50%;
      border-bottom-right-radius: 50%;
      background: #fff;
      border: 3px solid #fff;
      display: block;
    }
    .logo-wrap::after {
      content: "";
      position: absolute; inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(230,194,122,.45);
      animation: pulse 2.8s ease-out infinite;
    }
    @keyframes ring { to { transform: translateX(-50%) rotate(360deg); } }
    @keyframes pop { from { opacity: 0; scale: .3; } to { opacity: 1; scale: 1; } }
    @keyframes pulse { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
    /* keep the picture upright while ring spins */
    .logo-wrap img { animation: counter 8s linear infinite; }
    @keyframes counter { to { transform: rotate(-360deg); } }

    .eyebrow {
      font-size: .7rem;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      opacity: 0;
      animation: rise .8s .65s both;
    }
    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      letter-spacing: .16em;
      font-weight: 700;
      color: #fff;
      margin: 0 0 6px;
      opacity: 0;
      animation: rise .8s .75s both;
    }
    .sub {
      font-size: .85rem;
      font-weight: 300;
      color: rgba(255,255,255,.7);
      margin-bottom: 26px;
      opacity: 0;
      animation: rise .8s .85s both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .divider {
      border: 0; height: 1px; margin: 0 auto 24px; width: 70%;
      background: linear-gradient(90deg, transparent, rgba(230,194,122,.8), transparent);
      opacity: 0; animation: rise .8s .7s both;
    }

    /* Inputs */
    .field {
      position: relative;
      margin: 14px 0;
      opacity: 0;
      animation: rise .8s both;
    }
    .field:nth-of-type(1) { animation-delay: .95s; }
    .field:nth-of-type(2) { animation-delay: 1.05s; }

    .field input {
      width: 100%;
      padding: 15px 46px 15px 48px;
      font: 400 .98rem 'Poppins', sans-serif;
      color: #fff;
      background: rgba(10,0,5,.35);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      outline: none;
      transition: border-color .3s, box-shadow .3s, background .3s, transform .3s;
    }
    .field input::placeholder { color: rgba(255,255,255,.5); }
    .field input:focus {
      border-color: var(--gold);
      background: rgba(10,0,5,.5);
      box-shadow: 0 0 0 4px rgba(230,194,122,.16), 0 10px 26px rgba(0,0,0,.3);
      transform: translateY(-1px);
    }
    .field input:-webkit-autofill {
      -webkit-text-fill-color: #fff;
      -webkit-box-shadow: 0 0 0 40px #3a0a1a inset;
    }
    .field .ico {
      position: absolute; left: 16px; top: 50%;
      width: 20px; height: 20px;
      transform: translateY(-50%);
      fill: none; stroke: rgba(255,255,255,.6); stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      transition: stroke .3s;
      pointer-events: none;
    }
    .field:focus-within .ico { stroke: var(--gold); }

    .toggle {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      display: grid; place-items: center;
      background: transparent; border: 0; cursor: pointer;
      border-radius: 50%;
      transition: background .2s;
    }
    .toggle:hover { background: rgba(255,255,255,.1); }
    .toggle svg { width: 20px; height: 20px; fill: none; stroke: rgba(255,255,255,.65); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* Button */
    #loginBtn {
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      font: 600 .95rem 'Poppins', sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #b0143c 0%, var(--wine) 50%, #5e0620 100%);
      background-size: 200% 200%;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(135,11,45,.55), 0 1px 0 rgba(255,255,255,.3) inset;
      transition: transform .25s, box-shadow .25s;
      opacity: 0;
      animation: rise .8s 1.2s both, gradShift 6s ease-in-out infinite;
    }
    #loginBtn::before {
      content: "";
      position: absolute; top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
      transform: skewX(-20deg);
      animation: shine 3.6s 2s ease-in-out infinite;
    }
    #loginBtn:hover { transform: translateY(-3px); box-shadow: 0 20px 38px rgba(196,38,79,.55); }
    #loginBtn:active { transform: translateY(0) scale(.98); }
    @keyframes shine { 0% { left: -80%; } 40%, 100% { left: 140%; } }
    @keyframes gradShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .secure {
      margin-top: 22px;
      font-size: .74rem;
      color: rgba(255,255,255,.55);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      opacity: 0; animation: rise .8s 1.35s both;
    }
    .secure svg { width: 14px; height: 14px; fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Footer */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 16px;
      font-size: .8rem;
      color: rgba(255,255,255,.6);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,.08);
    }

    @media (max-width: 480px) {
      header { height: 64px; }
      header h1 { font-size: 1.05rem; letter-spacing: .14em; }
      .card { padding: 74px 22px 30px; border-radius: 22px; }
      .card h2 { font-size: 1.65rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    /* ===== Stability pass: no live blur, no repaint-heavy animation ===== */
    .bg-logo {
      width: 110vmax; height: 110vmax;
      opacity: .13;
      filter: none;
      mix-blend-mode: normal;
      will-change: transform;
      animation: bgSlow 50s ease-in-out infinite alternate;
    }
    .bg-logo.two { display: none; }
    @keyframes bgSlow {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.08); }
    }
    .orb { animation: none; }
    .grain { display: none; }

    header, footer, .card {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    header { background: rgba(42,4,16,.55); }
    footer { background: rgba(20,2,8,.6); }
    header::after { animation: none; }

    .card {
      background: linear-gradient(160deg, rgba(70,12,32,.88), rgba(34,6,16,.92));
      animation: cardIn2 .9s .1s cubic-bezier(.2,.9,.25,1) both;
    }
    @keyframes cardIn2 {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: none; }
    }
    .card::before {
      animation: none;
      background: linear-gradient(135deg, rgba(230,194,122,.9), rgba(196,38,79,.5) 40%, transparent 65%, rgba(230,194,122,.5));
    }

    .logo-wrap { animation: pop 1s .4s cubic-bezier(.3,1.6,.4,1) both; transform: translateX(-50%); }
    .logo-wrap img { animation: none; }

    .field input { transition: border-color .25s, box-shadow .25s; }
    .field input:focus {
      transform: none;
      box-shadow: 0 0 0 3px rgba(230,194,122,.18);
    }

    #loginBtn {
      background-size: 100% 100%;
      animation: rise .8s 1.1s both;
      transition: transform .2s, box-shadow .2s;
    }
    #loginBtn::before { animation: none; }
    #loginBtn:hover::before { animation: shine .9s ease-out; }

    /* ===== Inline message ===== */
    .msg {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: .84rem;
      line-height: 1.45;
      text-align: left;
      border: 1px solid transparent;
    }
    .msg.show { display: flex; animation: msgIn .35s ease-out both; }
    .msg svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .msg.error   { color: #ffd3d9; background: rgba(220,53,69,.18);  border-color: rgba(255,120,135,.45); }
    .msg.success { color: #d4f7e0; background: rgba(40,167,90,.2);   border-color: rgba(100,220,150,.45); }
    .msg.info    { color: #fbeccb; background: rgba(230,194,122,.14); border-color: rgba(230,194,122,.45); }
    .msg.error.show { animation: msgIn .35s ease-out both, shake .4s .1s; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
    #loginBtn:disabled { opacity: .7; cursor: wait; }

    /* ===== Force pure white headings (brand.css was tinting them silver) ===== */
    body header#top-header h1,
    body header h1#h1,
    body main .card h2 {
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      background: none !important;
      background-image: none !important;
      -webkit-background-clip: border-box !important;
              background-clip: border-box !important;
      opacity: 1 !important;
      filter: none !important;
      font-family: 'Playfair Display', serif !important;
      text-shadow: 0 2px 18px rgba(196,38,79,.6) !important;
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="bg-logo"></div>
    <div class="bg-logo two"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="grain"></div>
  </div>

  <header>
    <h1 id="h1">Please wait...</h1>
  </header>

  <main>
    <div class="card">
      <div class="logo-wrap">
        <img src="logo.jpg" alt="School Logo">
      </div>

      <p class="eyebrow">Secure Portal</p>
      <h2>WELCOME</h2>
      <p class="sub">Sign in to continue to your dashboard</p>
      <hr class="divider">

      <div class="field">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input type="email" id="email" placeholder="Username" autocomplete="username" required />
      </div>

      <div class="field">
        <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
        <button type="button" class="toggle" id="togglePw" aria-label="Show password">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div id="msg" class="msg" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        <span id="msgText"></span>
      </div>

      <button id="loginBtn">Login</button>

      <p class="secure">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        Protected &amp; encrypted sign-in
      </p>
    </div>
  </main>

  <footer>
    <small>©Mainafly 2025 - 2026</small>
  </footer>

  <!-- Show / hide password -->
  <script>
    (function () {
      var btn = document.getElementById("togglePw");
      var pw = document.getElementById("password");
      btn.addEventListener("click", function () {
        var show = pw.type === "password";
        pw.type = show ? "text" : "password";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        btn.style.opacity = show ? "1" : ".85";
      });
      // Enter key submits
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });
    })();
  </script>

  <!-- Original auth logic (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
    import {getFirestore, doc, setDoc, getDoc} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
    import {getAuth, createUserWithEmailAndPassword, updateProfile, deleteUser, onAuthStateChanged, signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    loginBtn.textContent = "Please wait..";
    h1.innerHTML = schoolName;
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let teachersRef = doc(db, schoolId, "teachers");
    let teacherDoc = await getDoc(teachersRef);
    let teachers = teacherDoc.exists() ? teacherDoc.data() : {};

    loginBtn.textContent = "Login";
    var schoolGeneratedUsername;

    async function onLoginSuccess(user, role) {

      if (!teachers[schoolGeneratedUsername]) {
        if (!(user.email == "dev@teacher." + schoolId)) {
          // await deleteUser(user);
          showMsg("You're not on the staff list. Please contact the admin if you think this is a mistake.", "error");
          return;
        }
      }

      if (role == "admin") {
        window.location.href = "admin/admin.html";
        return;
      }
      if (role == "teacher") {
        window.location.href = "teacher/index.html";
        return;
      }
      if (role == "student") {
        window.location.href = "student/index.html";
        return;
      }
      if (role == "guardian") {
        window.location.href = "guardian/index.html";
        return;
      }
      if (role == "alumni") {
        window.location.href = "alumni/index.html";
        return;
      }

      // redirect or load user-specific content here
    }

    const logBtn = document.getElementById("loginBtn");
    logBtn.onclick = signIn;

    const msgBox = document.getElementById("msg");
    const msgText = document.getElementById("msgText");

    function showMsg(text, type = "error") {
      msgBox.className = "msg " + type;
      msgText.textContent = text;
      void msgBox.offsetWidth; // restart animation
      msgBox.classList.add("show");
    }
    function hideMsg() { msgBox.className = "msg"; }

    document.getElementById("email").addEventListener("input", hideMsg);
    document.getElementById("password").addEventListener("input", hideMsg);

    function friendlyError(code) {
      switch (code) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Incorrect username or password. Please try again.";
        case "auth/invalid-email":
          return "That username doesn't look right. Please check it.";
        case "auth/too-many-requests":
          return "Too many attempts. Please wait a moment and try again.";
        case "auth/network-request-failed":
          return "Network problem. Check your connection and try again.";
        default:
          return "Login failed. Please try again. (" + code + ")";
      }
    }

    let reg = /.*@/;

    async function signIn() {
      if (!document.getElementById("email").value.trim() || !document.getElementById("password").value) {
        showMsg("Please enter your username and password.", "info");
        return;
      }
      hideMsg();
      logBtn.textContent = "Logging..";
      const username = document.getElementById("email").value;
      const email = username.replace(/@.*/, "") + `@teacher.${schoolId}`;
      schoolGeneratedUsername = username.replace(/@.*/, "");
      const role = username.replace(reg, "");
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          onLoginSuccess(userCredential.user, role);
          logBtn.textContent = "Login";
        })
        .catch(async (error) => {
          let user = teachers[schoolGeneratedUsername];

          if (user && user.psw == password) {
            await createUserWithEmailAndPassword(auth, email, password);
            let createdUser = auth.currentUser;

            await updateProfile(createdUser, { displayName: user.name });
            showMsg("Welcome, " + user.name + "!", "success");
            onLoginSuccess(createdUser, role);
            return;
          }
          showMsg(friendlyError(error.code), "error");
          logBtn.textContent = "Login";
        });
    }
  </script>

</body>
</html>
