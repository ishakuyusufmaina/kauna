  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f7f6f4, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: #2f2d33;
    }

    h1 {
      font-size: 2rem;
      max-width: 600px;
      margin-bottom: 2rem;
      padding: 0 20px;
      line-height: 1.4;
    }

    #install-btn {
      display: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      background: #f6e8ec; border: 1px solid #e8cdd5;
      color: #870b2d;
      
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(187,27,67, 0.2);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    small {
      font-size: 0.8rem;
    }

    #install-btn:hover {
      background-color: #9c3150;
      transform: translateY(-2px);
    }

    #install-btn:active {
      transform: scale(0.98);
    }
    .crest{width:150px;height:auto;margin-bottom:8px}
    h1{color:#2f2d33}
    #sName{color:#870b2d}
  </style>
  
  <script src="config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { document.getElementById('sName').textContent = schoolName; });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('Service Worker registered.', reg))
      .catch(err => console.error('Service Worker registration failed:', err));
  }
  </script>
  

  <!-- Kauna brand theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <img src="logo.jpg" alt="Kauna Private School crest" class="crest">

  <h1>Welcome to <small>SIB</small> <span id="sName"></span> Installation</h1>
  <button id="install-btn">Install App</button>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          alert(schoolName+" Version of SIB is being installed on your device, patience.");
          console.log('User accepted the install prompt');
        } else {
         // alert("Thank you for dismissing installation of Capital School Version of SIB on your device.");
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>

</body>
